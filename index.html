<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內布隆防具 - 選項變換模擬器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #121218;
        --panel-bg: #1e1e26;
        --slot-bg: #2a2a35;
        --border-color: #333340;
        --primary-color: #00e5ff;
        --accent-color: #ffd700;
        --text-main: #e0e0e0;
        --text-sub: #a0a0b0;
        --max-stat-color: #d3ab82; 
        --min-stat-color: #757575;
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* 容器佈局 */
    .container {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 20px;
        width: 100%;
        max-width: 900px;
    }

    /* 左側：裝備面板 */
    .weapon-panel {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .panel-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
    }

    .item-image {
        width: 64px;
        height: 64px;
        border-radius: 8px;
        border: 2px solid var(--primary-color);
        background: #000;
        object-fit: cover;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .item-info h2 {
        margin: 0;
        font-size: 1.2rem;
        color: #f16605; 
    }

    .item-info span {
        font-size: 0.9rem;
        color: var(--text-sub);
    }

    /* 屬性槽位 */
    .slots-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-grow: 1;
        margin-bottom: 20px;
    }

    .option-slot {
        background: var(--slot-bg);
        padding: 12px 15px;
        border-radius: 6px;
        border: 1px solid transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
        transition: all 0.2s;
        min-height: 50px;
    }
    
    .option-slot:hover {
        border-color: #555;
    }

    .option-name {
        flex: 1;
    }

    .score-tag {
        background: rgba(0, 229, 255, 0.15);
        color: var(--primary-color);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: bold;
        margin-left: 10px;
        white-space: nowrap;
    }

    /* 左側面板底部的總分區塊 */
    .panel-footer {
        border-top: 1px solid var(--border-color);
        padding-top: 15px;
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .total-score-label {
        font-size: 1rem;
        color: var(--text-sub);
        font-weight: bold;
    }

    .total-score-value {
        font-size: 1.8rem;
        font-weight: bold;
        color: var(--primary-color);
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        font-family: 'Consolas', monospace;
    }

    /* 右側：控制與數據 */
    .control-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* 數據儀表板 */
    .stats-card {
        background: var(--panel-bg);
        border-radius: 12px;
        padding: 20px;
        border: 1px solid var(--border-color);
    }

    /* 統計圖片佔位 */
    .stats-image-placeholder {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        border: 2px solid var(--primary-color);
        background: #000;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .stats-image-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 0.95rem;
    }

    .stat-row:last-child { margin-bottom: 0; }

    .stat-label { 
        color: var(--text-sub); 
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .stat-value { 
        font-weight: bold; 
        color: #fff;
        font-family: 'Consolas', monospace;
    }

    .stat-value.highlight { color: var(--accent-color); font-size: 1.1rem; }
    
    .rate-info {
        font-size: 0.75rem;
        color: #666;
        font-weight: normal;
    }
    
    /* 設定區 */
    .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,0,0,0.2);
        padding: 10px;
        border-radius: 8px;
        margin-top: 15px;
        font-size: 0.9rem;
    }

    .settings-row input {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--text-sub);
        color: var(--accent-color);
        width: 55px;
        text-align: right;
        font-size: 1rem;
        font-weight: bold;
    }
    .settings-row input:focus { outline: none; border-bottom-color: var(--accent-color); }
	
    /* 統計標題區塊 */
    .stats-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px dashed var(--border-color);
    }
    
    /* 統計標題文字 */
    .stats-title {
        color: #39ff14; 
        font-weight: bold;
        font-size: 1.1rem;
        text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
    }

    /* 按鈕群組 */
    .buttons-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    button {
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s, filter 0.2s;
        position: relative;
        overflow: hidden;
    }

    button:active { transform: scale(0.98); }

    .btn-roll {
        background: linear-gradient(135deg, var(--primary-color), #00b0ff);
        color: #000;
        box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
    }

    .btn-search {
        background: rgba(255, 215, 0, 0.1);
        color: var(--accent-color);
        border: 1px solid var(--accent-color);
    }
    .btn-search:hover { background: rgba(255, 215, 0, 0.2); }

    .btn-reset {
        background: transparent;
        color: var(--text-sub);
        border: 1px dashed var(--border-color);
        margin-top: 10px;
    }
    .btn-reset:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        border-color: #666;
    }

    /* 伸縮式選單通用樣式 */
    .score-accordion-panel {
        width: 100%;
        max-width: 900px;
        margin-top: 20px;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .accordion-toggle-btn {
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-main);
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 0;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }

    .accordion-toggle-btn:hover {
        background: rgba(0, 229, 255, 0.1);
        color: var(--primary-color);
    }

    /* 預設關閉（隱藏內容） */
    .accordion-content {
        display: none;
        padding: 20px;
        background: rgba(0, 0, 0, 0.25);
        border-top: 1px solid var(--border-color);
    }

    .score-cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 15px;
    }

    .score-card {
        background: var(--slot-bg);
        border-radius: 8px;
        padding: 12px 15px;
        border: 1px solid var(--border-color);
    }

    .score-card-header {
        color: var(--primary-color);
        font-size: 0.95rem;
        font-weight: bold;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
        margin-bottom: 10px;
    }

    .score-card-rules {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .score-rule-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-sub);
    }

    .score-rule-val {
        color: #fff;
    }

    .score-rule-pts {
        color: var(--accent-color);
        font-weight: bold;
        font-family: 'Consolas', monospace;
    }

    /* --- 計算機專屬樣式 --- */
    .calc-score-board {
        background: linear-gradient(180deg, rgba(30,30,38,0.9) 0%, rgba(20,20,25,0.9) 100%);
        border: 1px solid var(--primary-color);
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
        border-radius: 12px;
        padding: 15px 30px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .calc-score-label {
        font-size: 0.85rem;
        color: var(--primary-color);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }

    #calc-total {
        font-size: 2.2rem;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    #calc-options {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 15px;
        width: 100%;
    }

    .calc-option-card {
        background: var(--slot-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .calc-option-card:hover {
        border-color: #555;
    }

    .calc-option-card.active {
        border-color: var(--primary-color);
        background-color: rgba(0, 229, 255, 0.05);
    }

    .calc-option-label {
        font-size: 0.9rem;
        color: var(--text-sub);
        margin-bottom: 8px;
        font-weight: 500;
        line-height: 1.3;
    }

    .calc-select-wrapper {
        position: relative;
    }

    .calc-select-wrapper select {
        width: 100%;
        padding: 8px 10px;
        font-size: 0.9rem;
        background-color: var(--bg-color);
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        transition: border-color 0.2s;
    }

    .calc-select-wrapper select:focus {
        outline: none;
        border-color: var(--primary-color);
    }

    .calc-select-wrapper::after {
        content: '▼';
        font-size: 0.7rem;
        color: #888;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
    }

    /* 底部連結區塊 */
    .footer-links {
        margin-top: 25px;
        text-align: center;
        width: 100%;
    }

    .footer-links a {
        color: #666;
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.2s;
    }

    .footer-links a:hover {
        color: #a0a0b0;
        text-decoration: underline;
    }

    /* RWD */
    @media (max-width: 768px) {
        .container { grid-template-columns: 1fr; }
        .weapon-panel { min-height: auto; }
        .score-cards-grid, #calc-options { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="weapon-panel">
        <div class="panel-header">
            <img src="https://raw.githubusercontent.com/add1010751/Nebulon-Suit-Armor/refs/heads/main/%E5%85%A7%E5%B8%83%E9%9A%86%E9%98%B2%E5%85%B7.webp" class="item-image" alt="裝備圖片">
            <div class="item-info">
                <h2>+11 內布隆防具</h2>
                <span>屬性變更模擬</span>
            </div>
        </div>

        <div id="result" class="slots-container">
            <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
            <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
            <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
        </div>

        <div class="panel-footer">
            <span class="total-score-label">裝備總評分(僅供參考)</span>
            <span id="total-score" class="total-score-value">0.0</span>
        </div>
    </div>

    <div class="control-panel">
        <div class="stats-card">
             <div class="stats-header">
                <div class="stats-image-placeholder">
                    <img src="https://raw.githubusercontent.com/add1010751/Nebulon-Suit-Armor/refs/heads/main/%E9%98%B2%E5%85%B7%E5%B1%AC%E6%80%A7%E8%AE%8A%E6%8F%9B%E7%9F%B3.webp" alt="統計圖片">
                </div>
                <div class="stats-title">防具屬性變換石</div>
            </div>

            <div class="stat-row">
                <span class="stat-label">變換次數</span>
                <span id="click-count" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">台幣估算 (單次29NT)</span>
                <span class="stat-value highlight">NT$ <span id="ed-twd">0</span></span>
            </div>
            <div class="stat-row">
                <span class="stat-label">
                    港幣估算
                    <span id="rate-display" class="rate-info">
                        (讀取匯率中...)
                    </span>
                </span>
                <span class="stat-value">HK$ <span id="ed-hkd">0</span></span>
            </div>

            <div class="settings-row">
                <span>目標分數</span>
                <div>
                    <input id="target-score" type="number" step="0.1" value="17"> 分
                </div>
            </div>
        </div>

        <div class="buttons-group">
            <button class="btn-roll" onclick="wrapAction(getRandomOptions)">
                🎲 單次變換
            </button>
            <button class="btn-search" onclick="wrapAction(findCustomTargetOptions)">
                🔍 搜尋目標分數
            </button>
            <button class="btn-reset" onclick="resetSimulation()">
                🔄 重置模擬
            </button>
        </div>
    </div>
</div>

<!-- 選項 1：屬性評分明細（預設關閉） -->
<div class="score-accordion-panel">
    <button class="accordion-toggle-btn" onclick="toggleScoreMenu()">
        <span>屬性評分明細 ※隨意打的分-僅供參考</span>
        <span id="accordion-arrow">▼</span>
    </button>
    <div id="accordion-content" class="accordion-content">
        <div id="score-cards-container" class="score-cards-grid">
            <!-- 評分規則由 JavaScript 動態生成 -->
        </div>
    </div>
</div>

<!-- 選項 2：屬性評分計算器（預設關閉） -->
<div class="score-accordion-panel" style="margin-top: 15px;">
    <button class="accordion-toggle-btn" onclick="toggleCalcMenu()">
        <span>屬性評分手動計算機</span>
        <span id="calc-accordion-arrow">▼</span>
    </button>
    <div id="calc-accordion-content" class="accordion-content">
        <div class="calc-score-board">
            <div class="calc-score-label">計算機總分 (Total Score)</div>
            <div id="calc-total">0.0</div>
        </div>
        
        <div id="calc-options">
            <!-- 下拉選單卡片將由 JavaScript 動態生成 -->
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="btn-reset" id="calcResetBtn" style="margin-top: 0; padding: 10px 24px;">
                ↺ 重置屬性計算器
            </button>
        </div>
    </div>
</div>

<!-- 底部來源超連結 -->
<div class="footer-links">
    <a href="https://m.elsword.nexon.com/news/probability/354" target="_blank" rel="noopener noreferrer">機率來源</a>
</div>

<script>
let hkdToTwdRate = 4.1;

async function fetchExchangeRate() {
    const rateDisplay = document.getElementById('rate-display');
    try {
        const response = await fetch('https://open.er-api.com/v6/latest/HKD');
        const data = await response.json();
        
        if (data && data.rates && data.rates.TWD) {
            hkdToTwdRate = data.rates.TWD;
            rateDisplay.textContent = `(1:${hkdToTwdRate.toFixed(2)})`;
            rateDisplay.style.color = '#a0a0b0'; 
            updateStatsUI(clickCount, parseFloat(document.getElementById('total-score').textContent));
        } else {
            throw new Error("匯率資料格式錯誤");
        }
    } catch (error) {
        console.error("匯率獲取失敗:", error);
        rateDisplay.textContent = `(預設 1:${hkdToTwdRate})`;
        rateDisplay.style.color = '#d32f2f'; 
    }
}

window.onload = function() {
    fetchExchangeRate();
    renderScoreRulesUI(); // 頁面載入時自動渲染評分表
    initCalc();           // 頁面載入時初始化防具屬性計算器
};

// 原防具 scoreTable 數據
const scoreTable = [

function wrapAction(action) {
    setTimeout(() => {
        action();
    }, 10);
}

function updateStatsUI(count, score) {
    document.getElementById('click-count').textContent = count;
    document.getElementById('total-score').textContent = score.toFixed(1);
    
    const twd = count * 29; 
    document.getElementById('ed-twd').textContent = Math.round(twd).toLocaleString();

    const hkd = twd / hkdToTwdRate;
    document.getElementById('ed-hkd').textContent = Math.round(hkd).toLocaleString();
}

function weightedRandom(excluded = []) {
    let available = options.filter((_, i) => !excluded.includes(i));
    let totalWeight = available.reduce((sum, o) => sum + o[4], 0);
    let r = Math.random() * totalWeight;
    let cumulative = 0;
    for (let i = 0; i < available.length; i++) {
        cumulative += available[i][4];
        if (r <= cumulative) return options.indexOf(available[i]);
    }
    return options.indexOf(available[available.length - 1]);
}

function getScore(name, value) {
    let candidates = scoreTable.filter(s => s[0] === name);
    if (candidates.length === 0) return 0;
    
    let validCandidates = candidates.filter(s => value >= s[1] - 0.0001);
    if (validCandidates.length === 0) return 0;

    let bestMatch = validCandidates.reduce((prev, curr) => {
        return (curr[1] > prev[1]) ? curr : prev;
    });
    
    return bestMatch[2];
}

function formatOptionDisplay(name, value) {
    if (name === "武器強化數值每1，物理/魔法攻擊力等級") return `${name}+${value} Lv`;
    if (name === "物理/魔法攻擊力等級") return `${name}+${value} Lv`;
    if (name === "根據攻擊時給予的傷害量的n%，在3秒內給予持續傷害") return `${name.replace("n%", value + "%")}`;
    return `${name} : ${value}%`;
}

function generateSlotData(index) {
    let opt = options[index];
    let val;
    
    if (opt[0].startsWith("防具強化數值每1")) {
        const possibleValues = [0.02, 0.04, 0.06, 0.08, 0.10, 0.12, 0.14, 0.16, 0.18, 0.20];
        val = possibleValues[Math.floor(Math.random() * possibleValues.length)];
    } else {
        let minInt = Math.round(opt[1] * 10);
        let maxInt = Math.round(opt[2] * 10);
        let range = maxInt - minInt + 1;
        
        let randomInt = Math.floor(Math.random() * range) + minInt;
        val = randomInt / 10;
    }
    
    let score = getScore(opt[0], val);
    return { opt, val, score };
}

function getRandomOptions() {
    let selected = [];
    let resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '';
    let totalScore = 0;

    while (selected.length < 3) {
        let randomIndex = weightedRandom(selected);
        selected.push(randomIndex);
    }

    selected.forEach(index => {
        let { opt, val, score } = generateSlotData(index);
        totalScore += score;
        
        let div = document.createElement('div');
        div.className = "option-slot";
        
        let colorStyle = "";
        if (val === opt[1]) colorStyle = "color: var(--min-stat-color);";
        else if (val === opt[2]) colorStyle = "color: var(--max-stat-color); text-shadow: 0 0 5px rgba(211, 171, 130, 0.5);"; 
        
        div.innerHTML = `
            <span class="option-name" style="${colorStyle}">${formatOptionDisplay(opt[0], val)}</span>
            <span class="score-tag">${score} 分</span>
        `;
        resultDiv.appendChild(div);
    });

    clickCount++;
    updateStatsUI(clickCount, totalScore);
}

function findCustomTargetOptions() {
    let targetScore = parseFloat(document.getElementById('target-score').value) ;
    clickCount = 0;
    let localSearchCount = 0;
    
    while (true) {
        localSearchCount++;
        let selected = [];
        
        while (selected.length < 3) selected.push(weightedRandom(selected));

        let totalScore = 0;
        let tempHTML = "";

        selected.forEach(index => {
            let { opt, val, score } = generateSlotData(index);
            totalScore += score;

            let colorStyle = "";
            if (val === opt[1]) colorStyle = "color: var(--min-stat-color);";
            else if (val === opt[2]) colorStyle = "color: var(--max-stat-color); text-shadow: 0 0 5px rgba(211, 171, 130, 0.5);"; 

            tempHTML += `
                <div class="option-slot">
                    <span class="option-name" style="${colorStyle}">${formatOptionDisplay(opt[0], val)}</span>
                    <span class="score-tag">${score} 分</span>
                </div>`;
        });

        if (totalScore >= targetScore) {
            document.getElementById('result').innerHTML = tempHTML;
            clickCount += localSearchCount;
            updateStatsUI(clickCount, totalScore);
            break;
        }

        if (localSearchCount > 10000000) {
            alert("模擬超過 1,000 萬次仍未達成條件，請嘗試降低目標分數。");
            clickCount += localSearchCount;
            updateStatsUI(clickCount, 0);
            break;
        }
    }
}

function resetSimulation() {
    clickCount = 0;
    updateStatsUI(0, 0);
    
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `
        <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
        <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
        <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
    `;
}

/* 切換選單 1 展開/收合狀態 */
function toggleScoreMenu() {
    const content = document.getElementById('accordion-content');
    const arrow = document.getElementById('accordion-arrow');
    if (content.style.display === 'block') {
        content.style.display = 'none';
        arrow.textContent = '▼';
    } else {
        content.style.display = 'block';
        arrow.textContent = '▲';
    }
}

/* 依據 scoreTable 自動建構分數卡片清單 */
function renderScoreRulesUI() {
    const container = document.getElementById('score-cards-container');
    if (!container) return;

    const grouped = {};
    scoreTable.forEach(([name, val, score]) => {
        if (!grouped[name]) grouped[name] = [];
        grouped[name].push({ val, score });
    });

    let html = '';
    for (const [name, rules] of Object.entries(grouped)) {
        rules.sort((a, b) => b.val - a.val);

        let rulesHTML = rules.map(r => `
            <div class="score-rule-item">
                <span class="score-rule-val">${r.val}%</span>
                <span class="score-rule-pts">${r.score} 分</span>
            </div>
        `).join('');

        html += `
            <div class="score-card">
                <div class="score-card-header">${name}</div>
                <div class="score-card-rules">${rulesHTML}</div>
            </div>
        `;
    }

    container.innerHTML = html;
}

function toggleCalcMenu() {
    const content = document.getElementById('calc-accordion-content');
    const arrow = document.getElementById('calc-accordion-arrow');
    if (content.style.display === 'block') {
        content.style.display = 'none';
        arrow.textContent = '▼';
    } else {
        content.style.display = 'block';
        arrow.textContent = '▲';
    }
}

/* 直接讀取原本的 scoreTable (防具數據) 來初始化計算機選項 */
function initCalc() {
    const grouped = {};
    scoreTable.forEach(([name, value, score]) => {
        if (!grouped[name]) grouped[name] = [];
        grouped[name].push({ value, score });
    });

    const container = document.getElementById("calc-options");
    if (!container) return;

    container.innerHTML = "";

    Object.keys(grouped).forEach((name) => {
        const card = document.createElement("div");
        card.className = "calc-option-card";

        const label = document.createElement("label");
        label.className = "calc-option-label";
        label.textContent = name;
        
        const selectWrapper = document.createElement("div");
        selectWrapper.className = "calc-select-wrapper";

        const select = document.createElement("select");
        select.className = "calc-select";
        
        const emptyOpt = document.createElement("option");
        emptyOpt.value = "";
        emptyOpt.textContent = "請選擇數值...";
        select.appendChild(emptyOpt);

        // 依數值由大到小排序
        grouped[name].sort((a, b) => b.value - a.value);

        grouped[name].forEach(entry => {
            const opt = document.createElement("option");
            opt.value = entry.score;
            let unit = name.startsWith("防具強化數值每1") ? "" : "%";
            opt.textContent = ` ${entry.value}${unit} ➜ ${entry.score} 分`;
            select.appendChild(opt);
        });

        // 監聽變動
        select.addEventListener("change", function() {
            calcTotalScore();
            if (this.value && this.value !== "") {
                card.classList.add("active");
            } else {
                card.classList.remove("active");
            }
        });

        selectWrapper.appendChild(select);
        card.appendChild(label);
        card.appendChild(selectWrapper);
        container.appendChild(card);
    });

    // 重置按鈕事件
    document.getElementById("calcResetBtn").addEventListener("click", () => {
        document.querySelectorAll(".calc-select").forEach(sel => sel.value = "");
        document.querySelectorAll(".calc-option-card").forEach(card => card.classList.remove("active"));
        calcTotalScore();
    });
}

/* 計算機計算總分 */
function calcTotalScore() {
    let total = 0;
    document.querySelectorAll(".calc-select").forEach(sel => {
        total += parseFloat(sel.value || 0);
    });
    
    const totalEl = document.getElementById("calc-total");
    if (totalEl) {
        totalEl.textContent = total.toFixed(1);
    }
}
